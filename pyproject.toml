[project]
name = "organ-classifier-service"
version = "0.1.0"
description = "Organ classification on abdominal CT slices, served as a containerised ONNX inference API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Runtime dependencies only. Deliberately free of torch: the serving image
# runs ONNX Runtime, and pulling torch into it would add ~2 GB for nothing.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "onnxruntime>=1.20",
    "numpy>=2.0",
    "pillow>=11.0",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.20",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Training-only. Installed locally and in the training job, never in the image.
train = [
    "torch>=2.5",
    "onnx>=1.17",
    # Required by torch's dynamo-based ONNX exporter, which is the default
    # from torch 2.6 onward.
    "onnxscript>=0.1",
    # Symbolic shape inference during quantisation pre-processing.
    "sympy>=1.13",
    "timm>=1.0",
    "medmnist>=3.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    # Lets the test suite build tiny ONNX fixtures, so metadata and inference
    # behaviour are covered in CI without installing torch.
    "onnx>=1.17",
    "sympy>=1.13",
    # Backs organ_service.metrics, which quantisation imports, so the default
    # CI job needs it even though it installs no torch.
    "scikit-learn>=1.5",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/organ_service"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires the real trained model artefact, not run in the default CI job",
]